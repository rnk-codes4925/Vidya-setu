<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b1b36"/>
      <stop offset="50%" stop-color="#07101d"/>
      <stop offset="100%" stop-color="#020610"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- Ambient glows -->
  <circle cx="300" cy="200" r="250" fill="#0284c7" fill-opacity="0.08" filter="blur(80px)"/>
  <circle cx="1600" cy="400" r="300" fill="#7c3aed" fill-opacity="0.06" filter="blur(90px)"/>
  <circle cx="960" cy="900" r="400" fill="#f47b16" fill-opacity="0.04" filter="blur(100px)"/>
</svg>
